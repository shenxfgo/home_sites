[project]
name = "video-platform-backend"
version = "0.1.0"
description = "Video management platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "apscheduler>=3.10.4",
    "python-multipart>=0.0.6",
    "bcrypt>=4.1.0",
    "python-dotenv>=1.0.0",
    "ffmpeg-python>=0.2.0",
    # Alembic 现在是 schema 的唯一出处，空库建表也走它，所以不分方言都得装
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "black>=24.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    # 对象存储的用例靠它在内存里演一个桶，不碰网络
    "moto>=5.0",
]
# 只有真的添加对象存储视频源才需要；没装也不会拖慢普通安装
s3 = ["boto3>=1.34"]
# 换到 PostgreSQL 才需要：只有异步驱动。迁移工具在上面的核心依赖里
postgres = ["asyncpg>=0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
# alembic 自动生成的修订文件按模板排版，凑行宽没有意义
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# 这个文件必须先设好 S3 的环境变量再 import boto3/moto，导入因此天然不在最顶部
"tests/test_storage/test_s3_storage.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# 这三家只在自己仓库里带类型信息（boto3 的类型要另装 boto3-stubs），
# APScheduler 干脆没有 py.typed。缺的是别人的声明，不是我们的注解，
# 所以只对这几个包关掉"缺 stub 即报错"，其余照旧
module = ["apscheduler.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]